---
- name: Ensure dotfiles backup directory exists
  file:
    path: "{{ dotfiles_backup_path }}"
    state: directory

- name: Ensure XDG directories exist for Fish and other CLI tools
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/share"
    - "{{ ansible_facts['env']['HOME'] }}/.local/state"
    - "{{ ansible_facts['env']['HOME'] }}/.cache"

- name: Register Homebrew Fish as an allowed login shell
  lineinfile:
    path: /etc/shells
    line: /opt/homebrew/bin/fish
    state: present
  become: true
  when: ansible_facts['system'] == "Darwin"

- name: Read the configured login shell
  command: "dscl . -read /Users/{{ ansible_facts['user_id'] }} UserShell"
  register: configured_login_shell
  changed_when: false
  when: ansible_facts['system'] == "Darwin"

- name: Set Fish as the user's login shell
  command: >-
    dscl . -change /Users/{{ ansible_facts['user_id'] }} UserShell
    "{{ configured_login_shell.stdout | regex_replace('^UserShell: ', '') }}"
    /opt/homebrew/bin/fish
  become: true
  when: "ansible_facts['system'] == 'Darwin' and configured_login_shell.stdout != 'UserShell: /opt/homebrew/bin/fish'"

- name: Stat existing dotfiles
  stat:
    path: "{{ item.dest }}"
  loop: "{{ dotfiles }}"
  register: dotfiles_stat
  no_log: false

- name: Backup existing dotfiles if they are not symlinks
  copy:
    src: "{{ item.item.dest }}"
    dest: "{{ dotfiles_backup_path }}/"
    remote_src: true
  when:
    - item.stat.exists
    - not item.stat.islnk
  loop: "{{ dotfiles_stat.results }}"
  loop_control:
    label: "{{ item.item.dest }}"

- name: Remove non-symlink dotfiles
  file:
    path: "{{ item.item.dest }}"
    state: absent
  when:
    - item.stat.exists
    - not item.stat.islnk
  loop: "{{ dotfiles_stat.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  register: removed_files

- name: Ensure parent directories for dotfile symlinks exist
  file:
    path: "{{ item.dest | dirname }}"
    state: directory
  loop: "{{ dotfiles }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Create symlinks for dotfiles
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfiles }}"

- name: Read Bitbucket token from 1Password
  command: op read "{{ atlas.bitbucket.credential_op_ref }}" --no-newline
  register: op_bitbucket
  changed_when: false
  no_log: true
  failed_when: false
  when: ansible_facts['system'] == 'Darwin'

- name: Read Jira token from 1Password
  command: op read "{{ atlas.jira.credential_op_ref }}" --no-newline
  register: op_jira
  changed_when: false
  no_log: true
  failed_when: false
  when: ansible_facts['system'] == 'Darwin'

- name: Generate Neovim atlas .env file
  template:
    src: nvim-env.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim/.env"
    mode: "0600"
  vars:
    bitbucket_user: "{{ atlas.bitbucket.user | default('') }}"
    bitbucket_token: "{{ op_bitbucket.stdout | default('') }}"
    jira_base_url: "{{ atlas.jira.base_url | default('') }}"
    jira_email: "{{ atlas.jira.email | default('') }}"
    jira_token: "{{ op_jira.stdout | default('') }}"
