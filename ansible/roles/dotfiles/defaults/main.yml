dotfiles:
  # Fish config (managed alongside Zsh during the migration)
  - {
      src: "{{ playbook_dir }}/../config/fish",
      dest: "{{ ansible_env.HOME }}/.config/fish",
    }
  - {
      src: "{{ playbook_dir }}/../config/1Password/.config/1Password/ssh/agent.toml",
      dest: "{{ ansible_env.HOME }}/.config/1Password/ssh/agent.toml",
    }
    # Alias
  - {
      src: "{{ playbook_dir }}/../config/system/alias",
      dest: "{{ ansible_env.HOME }}/.config/alias",
    }
  - {
      src: "{{ playbook_dir }}/../config/system/scripts",
      dest: "{{ ansible_env.HOME }}/.config/scripts",
    }

    # Git
  - {
      src: "{{ playbook_dir }}/../config/git/.gitconfig",
      dest: "{{ ansible_env.HOME }}/.gitconfig",
    }
  - {
      src: "{{ playbook_dir }}/../config/git/.gitignore_global",
      dest: "{{ ansible_env.HOME }}/.gitignore_global",
    }

