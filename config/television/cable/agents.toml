[metadata]
name = "agents"
description = "Current running agents"
requirements = ["herdr", "jq"]

[source]
command = '''
herdr agent list | jq --argjson labels "$(herdr workspace list | jq '[.result.workspaces[] | {(.workspace_id): (.label // .workspace_id)}] | add')" -r '.result.agents[] | (if .agent_status == "working" then "▶" elif .agent_status == "blocked" then "‼" elif .agent_status == "done" then "✓" else "·" end) + "	" + .pane_id + "	" + .agent + "	" + ($labels[.workspace_id] // .workspace_id) + "	" + (.terminal_title_stripped // "")'
'''
display = "{split:	:0} {split:	:2}  {split:	:3}"
output = "{split:	:1}"
no_sort = true

[keybindings]
enter = "actions:focus"

[actions.focus]
description = "Focus selected agent"
command = "herdr agent focus '{split:	:1}'"
mode = "execute"
