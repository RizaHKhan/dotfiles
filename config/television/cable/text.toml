[metadata]
name = "text"
description = "Search file contents (excluding vendor and node_modules)"
requirements = ["rg", "bat", "nvim", "git"]

[source]
command = "rg . --line-number --no-heading --color=always --smart-case --no-ignore --glob '!**/vendor/**' --glob '!**/node_modules/**' \"$PWD\""
ansi = true

[preview]
command = "bat -n --color=always '{strip_ansi|split:\\::0}'"
offset = "{strip_ansi|split:\\::1}"

[keybindings]
enter = "actions:open_in_herdr_pane"

[actions.open_in_herdr_pane]
description = "Open selected match in neovim from its repo root in a new herdr pane"
command = "sh -c 'file=\"$1\"; line=\"$2\"; dir=$(dirname \"$file\"); repo=$(git -C \"$dir\" rev-parse --show-toplevel 2>/dev/null || printf \"%s\" \"$dir\"); rel=${file#\"$repo\"/}; cd \"$repo\" && nvim \"+$line\" \"$rel\"' _ '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "fork"
shell = "fish"
