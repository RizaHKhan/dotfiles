[metadata]
name = "aws-instances"
description = "List and preview AWS EC2 Instances"
requirements = ["aws", "herdr"]

[source]
command = "aws ec2 describe-instances --output json | jq -r '.Reservations[].Instances[] | [.InstanceId, (.Tags // [] | map(select(.Key == \"Name\").Value) | first // \"\"), (.PublicIpAddress // \"\")] | @tsv'"

[preview]
command = "aws ec2 describe-tags --output json --filters Name=resource-id,Values={split:\t:0} | jq -r '.Tags[] | [.Key, .Value] | @tsv'"

[ui]
layout = "landscape"
preview_panel = { size = 60 }

[keybindings]
enter = "actions:ssh"
pagedown = "scroll_preview_half_page_down"
pageup = "scroll_preview_half_page_up"
ctrl-d = "scroll_preview_half_page_down"
ctrl-u = "scroll_preview_half_page_up"

[actions.ssh]
description = "Connect to the SSH instance via SSH (herdr)"
command = "herdr pane rename \"$HERDR_PANE_ID\" \"{split:\t:2}\" && bash ~/.config/television/cable/scripts/aws-ssh.sh {split:\t:0}"
mode = "execute"

[actions.start]
description = "Start the selected EC2 instance"
command = "AWS_REGION=(test -n \"$AWS_REGION\"; and echo $AWS_REGION; or test -n \"$AWS_DEFAULT_REGION\"; and echo $AWS_DEFAULT_REGION; or echo us-east-1) aws ec2 start-instances --instance-ids {split:\t:0}"
mode = "fork"

[actions.stop]
description = "Stop the selected EC2 instance"
command = "AWS_REGION=(test -n \"$AWS_REGION\"; and echo $AWS_REGION; or test -n \"$AWS_DEFAULT_REGION\"; and echo $AWS_DEFAULT_REGION; or echo us-east-1) aws ec2 stop-instances --instance-ids {split:\t:0}"
mode = "fork"

[actions.terminate]
description = "Terminate (permanently delete) the selected EC2 instance"
command = "AWS_REGION=(test -n \"$AWS_REGION\"; and echo $AWS_REGION; or test -n \"$AWS_DEFAULT_REGION\"; and echo $AWS_DEFAULT_REGION; or echo us-east-1) aws ec2 terminate-instances --instance-ids {split:\t:0}"
mode = "fork"

[actions.ssm]
description = "Start an SSM session on the selected instance"
command = "AWS_REGION=(test -n \"$AWS_REGION\"; and echo $AWS_REGION; or test -n \"$AWS_DEFAULT_REGION\"; and echo $AWS_DEFAULT_REGION; or echo us-east-1) aws ssm start-session --target {split:\t:0}"
mode = "execute"

[actions.connection-string]
description = "Copy connection string to clipboard"
command = "sh -c 'set -- $(AWS_REGION=${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}} aws ec2 describe-instances --output text --instance-ids {split:\t:0} --query \"Reservations[*].Instances[0].[PublicDnsName,PublicIpAddress]\"); [ -n \"$1\" ] && echo \"ssh ec2-user@$1\" | xclip -selection clipboard || [ -n \"$2\" ] && echo \"ec2-user@$2.compute-1.amazonaws.com\" | xclip -selection clipboard'"
mode = "fork"
