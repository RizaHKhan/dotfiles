gui:
  screenMode: "normal" # one of 'normal' | 'half' | 'full'
  scrollHeight: 2
  showIcons: false
  showFileTree: true
  border: "single" # 'single' | 'double' | 'rounded' | 'hidden'
  theme:
    activeBorderColor:
      - "#FFE77A" # Teide darker: yellow
      - bold
    inactiveBorderColor:
      - "#586172" # Teide darker: comment
    searchingActiveBorderColor:
      - "#A592FF" # Teide darker: purple
      - bold
    optionsTextColor:
      - "#38FFA5" # Teide darker: green
    selectedLineBgColor:
      - "#2C313A" # Teide darker: bg_highlight
    cherryPickedCommitBgColor:
      - "#2f3546" # Teide darker: bg_visual
    cherryPickedCommitFgColor:
      - "#5CCEFF" # Teide darker: blue
    unstagedChangesColor:
      - "#F97791" # Teide darker: red
    defaultFgColor:
      - "#E7EAEE" # Teide darker: fg
    inactiveViewSelectedLineBgColor:
      - "#2C313A" # Teide darker: bg_highlight
git:
  autoFetch: true
  autoRefresh: true
  log:
    order: date-order
  localBranchSortOrder: date
  remoteBranchSortOrder: date
  # diffRenderers:
  #   - type: extDiff foobar
# Allow 'Esc' to quit from top level
quitOnTopLevelReturn: true
# Uncomment if you want per-repo overrides later
# localConfig:
#   enabled: true
# Opens a free opencode model (opencode/mimo-v2.5-free) to generate
# conventional-commit candidates, pick one with fzf, then commit.
customCommands:
  - key: "<c-o>"
    description: "Pick AI commit"
    command: "fish -c ai-commit"
    context: "files"
    output: terminal
