gui:
  screenMode: "normal" # one of 'normal' | 'half' | 'full'
  scrollHeight: 2
  showIcons: true
  showFileTree: true
  border: "single" # 'single' | 'double' | 'rounded' | 'hidden'
  theme:
    activeBorderColor:
      - "#d8a657" # yellow
      - bold
    inactiveBorderColor:
      - "#595959" # overlay0
    searchingActiveBorderColor:
      - "#d3869b" # mauve
      - bold
    optionsTextColor:
      - "#a9b665" # green
    selectedLineBgColor:
      - "#292929" # surface0
    cherryPickedCommitBgColor:
      - "#404040" # surface1
    cherryPickedCommitFgColor:
      - "#7daea3" # blue
    unstagedChangesColor:
      - "#ea6962" # red
    defaultFgColor:
      - "#ebdbb2" # text
    inactiveViewSelectedLineBgColor:
      - "#292929" # surface0
git:
  autoFetch: true
  autoRefresh: true
  log:
    order: date-order
  localBranchSortOrder: date
  remoteBranchSortOrder: date
  # diffRenderers:
  #   - type: extDiff foobar
# Allow 'Esc' to quit from top level
quitOnTopLevelReturn: true
# Uncomment if you want per-repo overrides later
# localConfig:
#   enabled: true
# Opens a free opencode model (opencode/mimo-v2.5-free) to generate
# conventional-commit candidates, pick one with fzf, then commit.
customCommands:
  - key: "<c-o>"
    description: "Pick AI commit"
    command: "fish -c ai-commit"
    context: "files"
    output: terminal
